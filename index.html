<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Katreos</title>
  <link rel="icon" href="/ikon.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      height: 100%;
      background: #000;
      position: relative;
      overflow: hidden;
      color: #ffffff;
      font-family: 'Share Tech Mono', monospace;
    }

    #particles-js {
      width: 100%;
      height: 100%;
      background: #000;
      position: fixed;
      top: 0; left: 0;
      z-index: 1;
    }

    .center-content {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
      width: 92%;
      max-width: 720px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.4em, 8vw, 3.7em);
      letter-spacing: 0.3em;
      color: #ffffff;
      text-shadow: 0 0 30px #00ffcc, 0 0 60px #00ffcc;
      margin-bottom: 12px;
    }

    .bio {
      font-size: clamp(0.92em, 3.6vw, 1.1em);
      line-height: 1.7;
      color: #bbbbbb;
      margin-bottom: 30px;
    }

    .q4-tag {
      position: fixed;
      top: 22px;
      right: 28px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.85em, 6vw, 2.4em);
      color: #00ffcc;
      text-shadow: 0 0 20px #00ffcc;
      z-index: 6;
    }

    /* SOL PANEL - PLAYLIST */
    .left-panel {
      position: fixed;
      top: 50%;
      left: 35px;
      transform: translateY(-50%);
      width: 290px;
      background: rgba(10, 10, 10, 0.96);
      border: 2px solid #ff0044;
      border-radius: 14px;
      padding: 20px 16px;
      z-index: 4;
      box-shadow: 0 0 30px rgba(255, 0, 68, 0.45);
    }

    /* SAĞ PANEL - DISCORD STATUS */
    .right-panel {
      position: fixed;
      top: 50%;
      right: 35px;
      transform: translateY(-50%);
      width: 290px;
      background: rgba(10, 10, 10, 0.96);
      border: 2px solid #00ffcc;
      border-radius: 14px;
      padding: 18px;
      z-index: 4;
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.4);
      min-height: 340px;
    }

    .discord-widget {
      width: 100%;
      height: 300px;
      border: none;
      background: transparent;
    }

    /* Müzik Kontrolleri */
    .music-controls {
      position: absolute;
      top: 68%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 340px;
      max-width: 92%;
      background: rgba(8, 8, 8, 0.97);
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 18px 20px;
      z-index: 5;
      box-shadow: 0 0 35px rgba(0, 255, 200, 0.5);
    }

    .now-playing {
      color: #00ffcc;
      text-shadow: 0 0 12px #00ffcc;
      text-align: center;
      margin-bottom: 14px;
      font-size: 1.05em;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
    }

    .control-btn {
      background: rgba(0, 255, 200, 0.12);
      border: 2px solid #00ffcc;
      color: #00ffcc;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45em;
      cursor: pointer;
      transition: all 0.3s;
    }

    .control-btn:hover {
      background: #00ffcc;
      color: #000;
      transform: scale(1.1);
    }

    .playlist {
      max-height: 260px;
      overflow-y: auto;
    }

    .song-item {
      padding: 11px 14px;
      margin: 6px 0;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95em;
    }

    .song-item:hover, .song-item.playing {
      background: rgba(0, 255, 200, 0.22);
      color: #00ffcc;
    }

    .whatsapp-btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      background: #25D366;
      color: white;
      padding: 14px 34px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 30px rgba(37,213,102,0.9);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    @media (max-width: 1100px) {
      .left-panel, .right-panel { display: none; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
  <div id="particles-js"></div>

  <audio id="bgMusic" preload="metadata"></audio>

  <div class="q4-tag">KATREOS</div>

  <!-- SOL - PLAYLIST -->
  <div class="left-panel">
    <div class="playlist" id="playlist"></div>
  </div>

  <!-- SAĞ - DISCORD STATUS (Lanyard) -->
  <div class="right-panel">
    <iframe class="discord-widget" 
            src="https://lanyard.cnrad.dev/api/1477281205056700428?theme=dark&bg=0a0a0a&borderRadius=12px" 
            frameborder="0"></iframe>
  </div>

  <!-- ORTA İÇERİK -->
  <div class="center-content">
    <img src="gif.gif" alt="Katreos" 
         style="max-width: 270px; width: 78%; border-radius: 12px; 
                box-shadow: 0 0 35px rgba(0,255,200,0.7); border: 2px solid #00ffcc; margin-bottom: 25px;">

    <h1>WHO IS KATREOS</h1>
    <div class="bio">
      My name is Katreos, I'm 17 years old and I want to become a Cybersecurity professional. 
      I've been involved in many online environments like Discord since 2020...<br><br>
      ~Katreos
    </div>
  </div>

  <!-- MÜZİK KONTROLLERİ -->
  <div class="music-controls">
    <div class="now-playing" id="nowPlaying">Şimdi Çalıyor: Avangard</div>
    
    <div class="controls">
      <div class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></div>
      <div class="control-btn" id="playPauseBtn"><i class="fas fa-pause"></i></div>
      <div class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></div>
    </div>
  </div>

  <a href="https://wa.me/17423864828" class="whatsapp-btn" target="_blank">
    <i class="fab fa-whatsapp"></i> WhatsApp Contact
  </a>

  <script>
    const audio = document.getElementById('bgMusic');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const nowPlaying = document.getElementById('nowPlaying');
    const playlistEl = document.getElementById('playlist');

    let playlist = [
      { title: "Avangard", src: "./avangard.mp3" },
      { title: "Beleza", src: "./beleza.mp3" },
      { title: "Brodyaga", src: "./brodyaga.mp3" },
      { title: "Montagem", src: "./montagem.mp3" }
    ];

    let currentTrack = 0;
    let isPlaying = false;

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      playlist.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `song-item ${index === currentTrack ? 'playing' : ''}`;
        item.innerHTML = `${index + 1}. ${song.title}`;
        item.onclick = () => { currentTrack = index; loadAndPlayTrack(); };
        playlistEl.appendChild(item);
      });
    }

    function loadAndPlayTrack() {
      audio.src = playlist[currentTrack].src;
      nowPlaying.textContent = `Şimdi Çalıyor: ${playlist[currentTrack].title}`;
      renderPlaylist();
      audio.play().then(() => {
        isPlaying = true;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
      }).catch(() => {});
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
      } else {
        audio.play();
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
      }
      isPlaying = !isPlaying;
    }

    function nextTrack() { currentTrack = (currentTrack + 1) % playlist.length; loadAndPlayTrack(); }
    function prevTrack() { currentTrack = (currentTrack - 1 + playlist.length) % playlist.length; loadAndPlayTrack(); }

    audio.addEventListener('ended', nextTrack);

    window.onload = () => {
      renderPlaylist();
      audio.src = playlist[0].src;
      nowPlaying.textContent = `Şimdi Çalıyor: ${playlist[0].title}`;

      let clicked = false;
      document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        if (!isPlaying) loadAndPlayTrack();
      }, { once: true });
    };

    playPauseBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);

    particlesJS('particles-js', {
      "particles": {
        "number": { "value": 80 },
        "color": { "value": "#ffffff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.6, "random": true },
        "size": { "value": 4, "random": true },
        "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.25, "width": 1 },
        "move": { "enable": true, "speed": 2, "random": true }
      },
      "interactivity": {
        "events": { "onhover": { "enable": true, "mode": "grab" } }
      }
    });
  </script>
</body>
</html>
