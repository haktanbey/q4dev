<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katreos</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #00f7ff;
      font-family: 'VT323', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* === ÇİZGİ ÇİZGİ ARKA PLAN (katreos stili + daha şekilli) === */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 247, 255, 0.08) 2px,
          rgba(0, 247, 255, 0.08) 4px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(255, 0, 255, 0.05) 2px,
          rgba(255, 0, 255, 0.05) 4px
        );
      background-size: 100% 4px, 4px 100%;
      pointer-events: none;
      z-index: -2;
      animation: scanline 8s linear infinite;
    }

    @keyframes scanline {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 0 100px, 0 0; }
    }

    /* Glitch + neon efekt */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 4.5rem;
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 
        0 0 10px #00f7ff,
        0 0 20px #00f7ff,
        0 0 40px #ff00ff;
      animation: glitch 1.5s infinite alternate;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(-3px, -3px); }
      60% { transform: translate(3px, 3px); }
      80% { transform: translate(3px, -3px); }
      100% { transform: translate(0); }
    }

    .bio {
      font-size: 1.4rem;
      margin: 20px 0 40px;
      opacity: 0.9;
      line-height: 1.4;
    }

    .links a {
      display: block;
      background: rgba(0, 247, 255, 0.1);
      color: #00f7ff;
      text-decoration: none;
      padding: 16px;
      margin: 12px 0;
      border: 2px solid #00f7ff;
      font-size: 1.5rem;
      transition: all 0.3s;
      box-shadow: 0 0 15px rgba(0, 247, 255, 0.5);
    }

    .links a:hover {
      background: #00f7ff;
      color: #000;
      transform: scale(1.05);
      box-shadow: 0 0 30px #ff00ff;
    }

    .footer {
      margin-top: 60px;
      font-size: 1.1rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CYBER KATREOS</h1>
    <p class="bio">
     Python HTML<br>
      <br>
      
    </p>

    <div class="links">
      <a href="https://wa.me/17423864828" target="_blank">→ WhatsApp</a>
      <a href="https://discord.com/k4treos/..." target="_blank">→ Discord</a>
      <a href="https://github.com/haktanbey" target="_blank">→ GitHub</a>
     </div>

    <div class="footer">
      Katreos
    </div>
  </div>
</body>
</html>
