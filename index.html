<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>卍 Katreos</title>
  <link rel="icon" href="/ikon.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      height: 100%;
      background: #000;
      position: relative;
      overflow: hidden;
      color: #ffffff;
      font-family: 'Share Tech Mono', monospace;
    }

    #particles-js {
      width: 100%;
      height: 100%;
      background: #000;
      position: fixed;
      top: 0; left: 0;
      z-index: 1;
    }

    .center-content {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
      width: 92%;
      max-width: 720px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.5em, 8.5vw, 3.8em);
      letter-spacing: 0.32em;
      color: #ffffff;
      text-shadow: 0 0 25px #ff0033, 0 0 55px #ff0033;
      margin-bottom: 12px;
    }

    .bio {
      font-size: clamp(0.92em, 3.6vw, 1.1em);
      line-height: 1.7;
      color: #cccccc;
      margin-bottom: 30px;
    }

    .q4-tag {
      position: fixed;
      top: 22px;
      right: 28px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.9em, 6vw, 2.5em);
      color: #ff0033;
      text-shadow: 0 0 20px #ff0033;
      z-index: 6;
    }

    /* SOL PANEL - PLAYLIST */
    .left-panel {
      position: fixed;
      top: 50%;
      left: 35px;
      transform: translateY(-50%);
      width: 290px;
      background: rgba(10, 10, 10, 0.97);
      border: 2px solid #ff0033;
      border-radius: 14px;
      padding: 18px 14px;
      z-index: 4;
      box-shadow: 0 0 35px rgba(255, 0, 51, 0.5);
    }

    /* SAĞ PANEL - DISCORD (KÜÇÜLTÜLDÜ) */


    .right-panel {
    position: fixed;
    top: 50%;
    right: 80px;           /* Kırmızı kutuya göre biraz sola çektim */
    transform: translateY(-50%);
    width: 280px;          /* Kırmızı kutuya daha iyi uysun diye genişlettim */
    background: rgba(10, 10, 10, 0.97);
    border: 2px solid #ff0033;
    border-radius: 14px;
    padding: 16px;
    z-index: 4;
    box-shadow: 0 0 35px rgba(255, 0, 51, 0.5);
    min-height: 320px;     /* Status kısmının rahat sığması için */
}
    }

    .discord-widget {
    width: 100%;
    height: 285px;         /* Status widget'inin tam sığması için artırdım */
    border: none;
    background: transparent;
    overflow: hidden;
    }

    /* MÜZİK KONTROLLERİ (Biraz küçültüldü) */
    .music-controls {
      position: absolute;
      top: 70%;               /* Biraz aşağı kaydırıldı */
      left: 50%;
      transform: translate(-50%, -50%);
      width: 310px;           /* ← Biraz küçültüldü */
      max-width: 90%;
      background: rgba(8, 8, 8, 0.97);
      border: 2px solid #ff0033;
      border-radius: 12px;
      padding: 15px 18px;
      z-index: 5;
      box-shadow: 0 0 35px rgba(255, 0, 51, 0.5);
    }

    .now-playing {
      color: #ff0033;
      text-shadow: 0 0 10px #ff0033;
      text-align: center;
      margin-bottom: 12px;
      font-size: 1.02em;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 12px;
    }

    .control-btn {
      background: rgba(255, 0, 51, 0.12);
      border: 2px solid #ff0033;
      color: #ff0033;
      width: 44px;            /* ← Butonlar biraz küçültüldü */
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35em;
      cursor: pointer;
      transition: all 0.3s;
    }

    .control-btn:hover {
      background: #ff0033;
      color: #000;
      transform: scale(1.1);
    }

    .playlist {
      max-height: 255px;
      overflow-y: auto;
    }

    .song-item {
      padding: 10px 13px;
      margin: 5px 0;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.94em;
    }

    .song-item:hover, .song-item.playing {
      background: rgba(255, 0, 51, 0.25);
      color: #ff0033;
    }

    .whatsapp-btn {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      background: #25D366;
      color: white;
      padding: 13px 32px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 30px rgba(37,213,102,0.9);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    @media (max-width: 1100px) {
      .left-panel, .right-panel { display: none; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
  <div id="particles-js"></div>

  <audio id="bgMusic" preload="metadata"></audio>

  <div class="q4-tag">KATREOS</div>

  <!-- SOL - PLAYLIST -->
  <div class="left-panel">
    <div class="playlist" id="playlist"></div>
  </div>

  <!-- SAĞ - DISCORD (Küçültüldü) -->
  <div class="right-panel">
    <iframe class="discord-widget" 
            src="https://lanyard.cnrad.dev/api/1477281205056700428?theme=dark&bg=0a0a0a&borderRadius=12px" 
            frameborder="0"></iframe>
  </div>

  <!-- ORTA İÇERİK -->
  <div class="center-content">
  <img src="standard (4).gif" alt="Katreos"
       style="width: 100%; height: auto; border-radius: 12px;
       box-shadow: 0 0 35px rgba(255,0,51,0.7); border: 2px solid #ff0033; margin-bottom: 25px;">

  <h1>#KATREOS</h1>

  <div class="bio">
    💻SOCİAL MEDİA EXPERT💻
  </div>
</div>

  <!-- MÜZİK KONTROLLERİ (Küçültüldü) -->
  <div class="music-controls">
    <div class="now-playing" id="nowPlaying">Now Listening:Avangard</div>
    
    <div class="controls">
      <div class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></div>
      <div class="control-btn" id="playPauseBtn"><i class="fas fa-pause"></i></div>
      <div class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></div>
    </div>
  </div>

  <a href="https://wa.me/17423864828" class="whatsapp-btn" target="_blank">
    <i class="fab fa-whatsapp"></i> WhatsApp Contact
  </a>

  <script>
    // ... (Müzik scripti aynı kalıyor, sadece son kısım)
    const audio = document.getElementById('bgMusic');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const nowPlaying = document.getElementById('nowPlaying');
    const playlistEl = document.getElementById('playlist');

    let playlist = [
      { title: "Avangard", src: "./avangard.mp3" },
      { title: "Beleza", src: "./beleza.mp3" },
      { title: "Brodyaga", src: "./brodyaga.mp3" },
      { title: "Montagem", src: "./montagem.mp3" },
      { title: "Massaka", src: "./Massaka-Dolunay.mp3" },
    ];

    let currentTrack = 0;
    let isPlaying = false;

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      playlist.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `song-item ${index === currentTrack ? 'playing' : ''}`;
        item.innerHTML = `${index + 1}. ${song.title}`;
        item.onclick = () => { currentTrack = index; loadAndPlayTrack(); };
        playlistEl.appendChild(item);
      });
    }

    function loadAndPlayTrack() {
      audio.src = playlist[currentTrack].src;
      nowPlaying.textContent = `Şimdi Çalıyor: ${playlist[currentTrack].title}`;
      renderPlaylist();
      audio.play().then(() => {
        isPlaying = true;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
      }).catch(() => {});
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
      } else {
        audio.play();
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
      }
      isPlaying = !isPlaying;
    }

    function nextTrack() { currentTrack = (currentTrack + 1) % playlist.length; loadAndPlayTrack(); }
    function prevTrack() { currentTrack = (currentTrack - 1 + playlist.length) % playlist.length; loadAndPlayTrack(); }

    audio.addEventListener('ended', nextTrack);

    window.onload = () => {
      renderPlaylist();
      audio.src = playlist[0].src;
      nowPlaying.textContent = `Şimdi Çalıyor: ${playlist[0].title}`;

      let clicked = false;
      document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        if (!isPlaying) loadAndPlayTrack();
      }, { once: true });
    };

    playPauseBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);

    particlesJS('particles-js', {
      "particles": {
        "number": { "value": 70 },
        "color": { "value": "#ff0033" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.55, "random": true },
        "size": { "value": 4, "random": true },
        "line_linked": { "enable": true, "distance": 140, "color": "#ff0033", "opacity": 0.3, "width": 1 },
        "move": { "enable": true, "speed": 1.8, "random": true }
      }
    });
  </script>
</body>
</html>
