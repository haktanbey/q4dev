<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Katreos</title>
  <link rel="icon" href="/ikon.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      height: 100%;
      background: #000;
      position: relative;
      overflow: hidden;
      color: #ffffff;
      font-family: 'Share Tech Mono', monospace;
    }

    #particles-js {
      width: 100%;
      height: 100%;
      background: #000;
      position: fixed;
      top: 0; left: 0;
      z-index: 1;
    }

    .center-content {
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
      width: 92%;
      max-width: 720px;
      padding: 15px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.3em, 7.5vw, 3.6em);
      letter-spacing: 0.25em;
      color: #ffffff;
      text-shadow: 0 0 30px #00ffcc;
      margin-bottom: 10px;
    }

    .bio {
      font-size: clamp(0.9em, 3.5vw, 1.1em);
      line-height: 1.65;
      color: #bbbbbb;
      margin-bottom: 25px;
    }

    .q4-tag {
      position: fixed;
      top: 20px;
      right: 25px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.8em, 5.5vw, 2.4em);
      color: #00ffcc;
      text-shadow: 0 0 15px #00ffcc;
      z-index: 6;
    }

    /* Sol Panel - Playlist */
    .left-panel {
      position: fixed;
      top: 50%;
      left: 40px;
      transform: translateY(-50%);
      width: 280px;
      background: rgba(10, 10, 10, 0.95);
      border: 2px solid #ff0044;
      border-radius: 12px;
      padding: 18px;
      z-index: 4;
      box-shadow: 0 0 25px rgba(255, 0, 68, 0.4);
    }

    .panel-title {
      color: #ff0044;
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.1em;
      text-shadow: 0 0 10px #ff0044;
    }

    /* Sağ Panel - Boş (Discord için hazır) */
    .right-panel {
      position: fixed;
      top: 50%;
      right: 40px;
      transform: translateY(-50%);
      width: 280px;
      background: rgba(10, 10, 10, 0.95);
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 18px;
      z-index: 4;
      box-shadow: 0 0 25px rgba(0, 255, 200, 0.4);
      min-height: 320px;
    }

    /* Müzik Player (Orta) */
    .music-player {
      position: absolute;
      top: 68%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 340px;
      max-width: 92%;
      background: rgba(8, 8, 8, 0.97);
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 20px 18px;
      z-index: 5;
      box-shadow: 0 0 40px rgba(0, 255, 200, 0.5);
    }

    .now-playing {
      color: #00ffcc;
      text-shadow: 0 0 12px #00ffcc;
      text-align: center;
      margin-bottom: 15px;
      font-size: 1.05em;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 16px;
    }

    .control-btn {
      background: rgba(0, 255, 200, 0.1);
      border: 2px solid #00ffcc;
      color: #00ffcc;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4em;
      cursor: pointer;
      transition: 0.3s;
    }

    .control-btn:hover {
      background: #00ffcc;
      color: #000;
      transform: scale(1.1);
    }

    .playlist {
      max-height: 200px;
      overflow-y: auto;
    }

    .song-item {
      padding: 10px 12px;
      margin: 5px 0;
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      cursor: pointer;
    }

    .song-item:hover, .song-item.playing {
      background: rgba(0, 255, 200, 0.2);
      color: #00ffcc;
    }

    .whatsapp-btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      background: #25D366;
      color: white;
      padding: 13px 30px;
      border-radius: 50px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 30px rgba(37,213,102,0.9);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    @media (max-width: 1100px) {
      .left-panel, .right-panel { display: none; }
      .music-player { top: 72%; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
  <div id="particles-js"></div>

  <audio id="bgMusic" preload="metadata"></audio>

  <div class="q4-tag">KATREOS</div>

  <!-- SOL PANEL - PLAYLIST -->
  <div class="left-panel">
    <div class="panel-title">PLAYLIST</div>
    <div class="playlist" id="leftPlaylist"></div>
  </div>

  <!-- SAĞ PANEL - DISCORD AKTİFLİK (Şu an boş) -->
  <div class="right-panel" id="discordPanel">
    <div class="panel-title" style="color:#00ffcc;">DISCORD STATUS</div>
    <!-- Buraya Discord Lanyard gelecek -->
    <p style="text-align:center; color:#666; margin-top:80px; font-size:0.9em;">
      Discord ID girilmedi
    </p>
  </div>

  <!-- ORTA - GIF + MÜZİK PLAYER -->
  <div class="center-content">
    <img src="gif.gif" alt="Katreos" 
         style="max-width: 260px; width: 75%; border-radius: 12px; 
                box-shadow: 0 0 30px rgba(0,255,200,0.6); border: 2px solid #00ffcc; margin-bottom: 20px;">

    <h1>WHO IS KATREOS</h1>
    <div class="bio">
      My name is Katreos, I'm 17 years old and I want to become a Cybersecurity professional...<br><br>
      ~Katreos
    </div>
  </div>

  <!-- Müzik Player -->
  <div class="music-player">
    <div class="now-playing" id="nowPlaying">Şimdi Çalıyor: Avangard</div>
    
    <div class="controls">
      <div class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></div>
      <div class="control-btn" id="playPauseBtn"><i class="fas fa-pause"></i></div>
      <div class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></div>
    </div>

    <div class="playlist" id="playlist"></div>
  </div>

  <a href="https://wa.me/17423864828" class="whatsapp-btn" target="_blank">
    <i class="fab fa-whatsapp"></i> WhatsApp Contact
  </a>

  <script>
    const audio = document.getElementById('bgMusic');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const nowPlaying = document.getElementById('nowPlaying');
    const playlistEl = document.getElementById('playlist');
    const leftPlaylistEl = document.getElementById('leftPlaylist');

    let playlist = [
      { title: "Avangard", src: "./avangard.mp3" },
      { title: "Beleza", src: "./beleza.mp3" },
      { title: "Brodyaga", src: "./brodyaga.mp3" },
      { title: "Montagem", src: "./montagem.mp3" }
    ];

    let currentTrack = 0;
    let isPlaying = false;

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      leftPlaylistEl.innerHTML = '';

      playlist.forEach((song, index) => {
        // Ana müzik player playlist
        const item = document.createElement('div');
        item.className = `song-item ${index === currentTrack ? 'playing' : ''}`;
        item.innerHTML = `${index + 1}. ${song.title}`;
        item.onclick = () => { currentTrack = index; loadAndPlayTrack(); };
        playlistEl.appendChild(item);

        // Sol panel playlist
        const leftItem = document.createElement('div');
        leftItem.className = `song-item ${index === currentTrack ? 'playing' : ''}`;
        leftItem.innerHTML = `${index + 1}. ${song.title}`;
        leftItem.onclick = () => { currentTrack = index; loadAndPlayTrack(); };
        leftPlaylistEl.appendChild(leftItem);
      });
    }

    function loadAndPlayTrack() {
      audio.src = playlist[currentTrack].src;
      nowPlaying.textContent = `Şimdi Çalıyor: ${playlist[currentTrack].title}`;
      renderPlaylist();
      audio.play().then(() => {
        isPlaying = true;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
      }).catch(() => {});
    }

    function togglePlay() {
      if (isPlaying) audio.pause(); else audio.play();
      isPlaying = !isPlaying;
      playPauseBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
    }

    function nextTrack() { currentTrack = (currentTrack + 1) % playlist.length; loadAndPlayTrack(); }
    function prevTrack() { currentTrack = (currentTrack - 1 + playlist.length) % playlist.length; loadAndPlayTrack(); }

    audio.addEventListener('ended', nextTrack);

    window.onload = () => {
      renderPlaylist();
      audio.src = playlist[0].src;
      nowPlaying.textContent = `Şimdi Çalıyor: ${playlist[0].title}`;

      let clicked = false;
      document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        if (!isPlaying) loadAndPlayTrack();
      }, { once: true });
    };

    playPauseBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);

    particlesJS('particles-js', { /* aynı particles ayarları */ });
  </script>
</body>
</html>
