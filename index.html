<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Katreos</title>
  <link rel="icon" href="/ikon.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      height: 100%;
      background: #000;
      position: relative;
      overflow: hidden;
      color: #ffffff;
      font-family: 'Share Tech Mono', monospace;
    }

    #particles-js {
      width: 100%;
      height: 100%;
      background: #000;
      position: fixed;
      top: 0; left: 0;
      z-index: 1;
    }

    .center-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
      width: 92%;
      max-width: 700px;
      padding: 15px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.2em, 7vw, 3.5em);
      letter-spacing: 0.25em;
      color: #ffffff;
      text-shadow: 0 0 20px #ffffff, 0 0 40px #ffffff;
      animation: glow 3s infinite alternate;
      margin-bottom: 15px;
    }

    .bio {
      font-size: clamp(0.95em, 3.8vw, 1.2em);
      line-height: 1.6;
      color: #ffffff;
      text-shadow: 0 0 6px rgba(255,255,255,0.3);
      margin-bottom: 30px;
    }

    .q4-tag {
      position: fixed;
      top: 10px;
      right: 15px;
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(1.6em, 5vw, 2.2em);
      color: #ffffff;
      text-shadow: 0 0 15px #ffffff;
      z-index: 3;
      letter-spacing: 0.1em;
      animation: pulse 4s infinite;
    }

    /* ========== SOL TARAFA TAŞINAN MÜZİK PLAYER ========== */
    .music-player {
      position: fixed;
      left: 30px;
      top: 180px;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid #ffffff33;
      border-radius: 14px;
      padding: 18px 20px;
      width: 320px;
      z-index: 4;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px rgba(0, 255, 200, 0.15);
    }

    .now-playing {
      font-size: 1.05em;
      margin-bottom: 14px;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc;
      text-align: center;
    }

    .playlist {
      max-height: 240px;
      overflow-y: auto;
      margin: 15px 0;
    }

    .playlist::-webkit-scrollbar {
      width: 5px;
    }

    .playlist::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 10px;
    }

    .song-item {
      padding: 11px 14px;
      margin: 5px 0;
      background: rgba(255,255,255,0.06);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.96em;
    }

    .song-item:hover, .song-item.playing {
      background: rgba(0, 255, 200, 0.18);
      color: #00ffcc;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 15px 0;
    }

    .control-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid #ffffff44;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.45em;
      cursor: pointer;
      transition: all 0.3s;
    }

    .control-btn:hover {
      background: rgba(0, 255, 200, 0.2);
      transform: scale(1.08);
    }

    .whatsapp-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      background: #25D366;
      color: white;
      padding: 12px 26px;
      border-radius: 50px;
      font-size: clamp(1em, 4vw, 1.2em);
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(37,213,102,0.7);
      display: flex;
      align-items: center;
      gap: 10px;
      border: 2px solid #ffffff;
    }

    .sound-notice {
      position: fixed;
      top: 55px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 22px;
      border-radius: 8px;
      z-index: 10;
    }

    @keyframes glow { from { text-shadow: 0 0 15px #fff, 0 0 30px #fff; } to { text-shadow: 0 0 40px #fff, 0 0 70px #fff; } }
    @keyframes pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 1; transform: scale(1.04); } }

    /* Mobilde müzik player'ı daha iyi göstermek için */
    @media (max-width: 768px) {
      .music-player {
        left: 50%;
        top: 220px;
        transform: translateX(-50%);
        width: 88%;
        max-width: 340px;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
</head>
<body>
  <div id="particles-js"></div>

  <audio id="bgMusic" preload="metadata"></audio>

  <div class="q4-tag">Katreos</div>
  <div class="sound-notice" id="soundNotice">Tıkla ve müziği aç!</div>

  <!-- SOL TARAFTA MÜZİK PLAYER -->
  <div class="music-player">
    <div class="now-playing" id="nowPlaying">Şarkı yükleniyor...</div>
    
    <div class="controls">
      <div class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></div>
      <div class="control-btn" id="playPauseBtn"><i class="fas fa-play"></i></div>
      <div class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></div>
    </div>

    <div class="playlist" id="playlist"></div>
  </div>

  <div class="center-content">
    <h1>WHO IS KATREOS</h1>
    <div class="bio">
      My name is Katreos, I'm 17 years old and I want to become a Cybersecurity professional. 
      I've been involved in many online environments like Discord since 2020...<br><br>
      ~Katreos
    </div>

    <div style="text-align: center; margin: 30px 0 45px 0;">
      <img src="gif.gif" alt="Katreos" 
           style="max-width: 280px; width: 80%; height: auto; border-radius: 12px; 
                  box-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 30px rgba(255,255,255,0.5); 
                  border: 1px solid #ffffff;">
    </div>
  </div>

  <a href="https://wa.me/17423864828" class="whatsapp-btn" target="_blank">
    <i class="fab fa-whatsapp"></i> WhatsApp Contact
  </a>

  <script>
    const audio = document.getElementById('bgMusic');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const nowPlaying = document.getElementById('nowPlaying');
    const playlistEl = document.getElementById('playlist');
    const soundNotice = document.getElementById('soundNotice');

    let playlist = [
      { title: "Avangard", src: "./avangard.mp3" },
      { title: "Beleza", src: "./beleza.mp3" },
      { title: "Brodyaga", src: "./brodyaga.mp3" },
      { title: "Montagem", src: "./montagem.mp3" }
    ];

    let currentTrack = 0;
    let isPlaying = false;

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      playlist.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `song-item ${index === currentTrack ? 'playing' : ''}`;
        item.innerHTML = `${index + 1}. ${song.title}`;
        item.onclick = () => {
          currentTrack = index;
          loadAndPlayTrack();
        };
        playlistEl.appendChild(item);
      });
    }

    function loadAndPlayTrack() {
      audio.src = playlist[currentTrack].src;
      nowPlaying.textContent = `Şimdi Çalıyor: ${playlist[currentTrack].title}`;
      renderPlaylist();
      
      audio.play().then(() => {
        isPlaying = true;
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
      }).catch(() => {});
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
      } else {
        audio.play();
        playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
      }
      isPlaying = !isPlaying;
    }

    function nextTrack() {
      currentTrack = (currentTrack + 1) % playlist.length;
      loadAndPlayTrack();
    }

    function prevTrack() {
      currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
      loadAndPlayTrack();
    }

    audio.addEventListener('ended', nextTrack);

    // Hata yakalama
    audio.addEventListener('error', () => {
      nowPlaying.textContent = "❌ Dosya bulunamadı";
      nowPlaying.style.color = "#ff4444";
    });

    window.onload = () => {
      renderPlaylist();
      audio.src = playlist[0].src;
      nowPlaying.textContent = `Şimdi Çalıyor: ${playlist[0].title}`;

      let clicked = false;
      document.body.addEventListener('click', () => {
        if (clicked) return;
        clicked = true;
        soundNotice.classList.add('hidden');
        if (!isPlaying) loadAndPlayTrack();
      }, { once: true });
    };

    playPauseBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);

    // Particles
    particlesJS('particles-js', {
      "particles": {
        "number": { "value": 30, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#ffffff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.3, "random": true },
        "size": { "value": 2, "random": true },
        "line_linked": { "enable": true, "distance": 120, "color": "#ffffff", "opacity": 0.2, "width": 0.6 },
        "move": { "enable": true, "speed": 0.8, "direction": "none", "random": true, "straight": false }
      },
      "interactivity": {
        "detect_on": "canvas",
        "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
        "modes": { "grab": { "distance": 150, "line_linked": { "opacity": 0.5 } }, "push": { "particles_nb": 2 } }
      },
      "retina_detect": true
    });
  </script>
</body>
</html>
